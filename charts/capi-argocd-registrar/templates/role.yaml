{{- if .Values.rbac.create }}
# Role for managing ArgoCD cluster secrets in the ArgoCD namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "capi-argocd-registrar.fullname" . }}-argocd
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "capi-argocd-registrar.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "capi-argocd-registrar.fullname" . }}-argocd
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "capi-argocd-registrar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "capi-argocd-registrar.fullname" . }}-argocd
subjects:
  - kind: ServiceAccount
    name: {{ include "capi-argocd-registrar.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Role for leader election leases in the controller namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "capi-argocd-registrar.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capi-argocd-registrar.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "capi-argocd-registrar.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capi-argocd-registrar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "capi-argocd-registrar.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "capi-argocd-registrar.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
