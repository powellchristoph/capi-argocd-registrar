{{- if .Values.pdb.create }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "capi-argocd-registrar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capi-argocd-registrar.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "capi-argocd-registrar.selectorLabels" . | nindent 6 }}
{{- end }}