version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - noctx
    - gocritic
    - misspell
  settings:
    gosec:
      excludes:
        # G101: false-positive on constant names containing "token"
        - G101
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck
      # G117 (bearerToken JSON field) is not in the gosec enum for v2.1.6;
      # suppress via text match instead of gosec.excludes.
      - linters: [gosec]
        text: "bearerToken"
